# Hourly trigger for server-sent reminders (works on any Vercel plan).
# Needs two repository secrets: APP_URL (e.g. https://your-app.vercel.app)
# and CRON_SECRET (same value as the CRON_SECRET env var in Vercel).
name: notify-cron
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch: {}
jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Send due reminders
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then echo "APP_URL / CRON_SECRET not set — skipping"; exit 0; fi
          curl -fsS -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/notify"
